name: iOS compile

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile host and extensions
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check bundle identifiers
        run: python3 scripts/check-identity.py

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          dotnet --version

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Build Swift Network Extensions
        run: bash scripts/build-extensions.sh

      - name: Build MAUI iOS host
        run: >
          dotnet build src/IosContentFilter/IosContentFilter.csproj
          -c Release
          -f net10.0-ios
          -p:RuntimeIdentifier=ios-arm64
          -p:EnableCodeSigning=false
          -p:CodesignRequireProvisioningProfile=false
          -p:ArchiveOnBuild=false
          -p:SkipFilterExtensionBuild=true
